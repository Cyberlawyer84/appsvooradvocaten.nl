<script src="posts.js?v=9"></script>
<script>
function fmtDate(iso){
  var m=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
  var p=String(iso).split('-');
  return parseInt(p[2],10)+' '+m[parseInt(p[1],10)-1]+' '+p[0];
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
(function(){
  var el=document.getElementById('posts');
  if(!window.POSTS||!POSTS.length){ el.innerHTML='<p class="blog-empty">Nog geen berichten.</p>'; return; }
  // Alleen berichten tonen waarvan de publicatiedatum is bereikt (datum in de toekomst = nog verborgen).
  var d=new Date(), pad=function(n){ return (n<10?'0':'')+n; };
  var today=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  var visible=POSTS.filter(function(p){ return p.date<=today; });
  if(!visible.length){ el.innerHTML='<p class="blog-empty">Nog geen berichten.</p>'; return; }
  var sorted=visible.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
  el.innerHTML=sorted.map(function(p){
    var isTip=p.type==='tip';
    var badge='<span class="pbadge '+(isTip?'tip':'blog')+'">'+(isTip?'Tip':'Blog')+'</span>';
    var appline='';
    if(isTip){
      var app=p.app?'<span class="appname">'+esc(p.app)+'</span>':'';
      var link=p.link?'<a class="applink" href="'+esc(p.link)+'">Bekijk app →</a>':'';
      if(app||link){ appline='<div class="appline">'+app+link+'</div>'; }
    }
    var icon=p.icon?'<img class="post-icon" src="'+esc(p.icon)+'" alt="'+esc((p.app||p.title)+' icoon')+'" loading="lazy">':'';
    return '<article class="post">'+
      '<div class="post-top">'+badge+'<span class="post-date">'+fmtDate(p.date)+'</span></div>'+
      '<div class="post-head'+(icon?'':' no-icon')+'">'+icon+'<h2>'+esc(p.title)+'</h2></div>'+appline+
      '<div class="post-body">'+(p.body||'')+'</div>'+
    '</article>';
  }).join('');
})();
</script>
