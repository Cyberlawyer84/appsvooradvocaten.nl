<script src="posts.js?v=12"></script>
<script>
function fmtDate(iso){
  var m=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var p=String(iso).split('-');
  return m[parseInt(p[1],10)-1]+' '+parseInt(p[2],10)+', '+p[0];
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
(function(){
  var el=document.getElementById('posts');
  if(!window.POSTS||!POSTS.length){ el.innerHTML='<p class="blog-empty">No posts yet.</p>'; return; }
  // Only show posts whose publication date has been reached (date in the future = still hidden).
  var d=new Date(), pad=function(n){ return (n<10?'0':'')+n; };
  var today=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  var visible=POSTS.filter(function(p){ return p.date<=today; });
  if(!visible.length){ el.innerHTML='<p class="blog-empty">No posts yet.</p>'; return; }
  var sorted=visible.sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
  el.innerHTML=sorted.map(function(p){
    var isTip=p.type==='tip';
    var badge='<span class="pbadge '+(isTip?'tip':'blog')+'">'+(isTip?'Tip':'Blog')+'</span>';
    var appline='';
    if(isTip){
      var app=p.app?'<span class="appname">'+esc(p.app)+'</span>':'';
      var link=p.link?'<a class="applink" href="'+esc(p.link)+'">View app →</a>':'';
      if(app||link){ appline='<div class="appline">'+app+link+'</div>'; }
    }
    var icon=p.icon?'<img class="post-icon" src="'+esc(p.icon)+'" alt="'+esc((p.app||p.title)+' icon')+'" loading="lazy">':'';
    var disc=(isTip && !p.nodisc)?'<p class="post-disc">Transparency: this is not a paid partnership or affiliate. I have no financial involvement with the app discussed here and receive nothing for it.</p>':'';
    var foot='<div class="post-foot"><div class="post-sign">'+fmtDate(p.date)+' · Jeroen Gunning</div>'+disc+'</div>';
    return '<article class="post">'+
      '<div class="post-top">'+badge+'</div>'+
      '<div class="post-head'+(icon?'':' no-icon')+'">'+icon+'<h2>'+esc(p.title)+'</h2></div>'+appline+
      '<div class="post-body">'+(p.body||'')+'</div>'+
      foot+
    '</article>';
  }).join('');
})();
</script>
